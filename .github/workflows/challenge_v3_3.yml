name: EventSure V3.3 Public Challenge Qualification
on:
  push:
    branches:
      - release/eventsure-v3.1
permissions:
  contents: read
concurrency:
  group: eventsure-v33-challenge-once
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node --check scripts/challenge_v3_3_inconclusive.mjs
  challenge:
    needs: preflight
    if: ${{ contains(github.event.head_commit.message, '[AUTO_CHALLENGE_V33]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Submit and independently verify one public challenge
        env:
          EVENTSURE_CHALLENGE_AUTH: AUTHORIZED_STUDIONET_ONCE
        run: node scripts/challenge_v3_3_inconclusive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventsure-v33-challenge-receipts
          path: artifacts/v3_3_challenge/
          if-no-files-found: warn
