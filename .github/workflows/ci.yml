name: EventSure CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q contracts tests
      - run: python -m unittest discover -s tests -v
      - name: Source hash parity
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          p=json.load(open('deployments/STUDIONET_V2_PROOF.json'))
          code=pathlib.Path(p['source_path']).read_bytes()
          assert hashlib.sha256(code).hexdigest()==p['source_sha256']
          assert len(code)==p['source_bytes']
          print('SOURCE_INTEGRITY=PASS')
          PY
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
  genvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'genvm-linter==0.11.1rc2'
      - name: GenVM semantic validation
        env:
          GENVM_VERSION: v0.6.0-rc6
        run: genvm-lint check contracts/EventSureV2.py

