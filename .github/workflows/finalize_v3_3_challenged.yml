name: EventSure V3.3 Finalize Reconsidered Case
on:
  push:
    branches:
      - release/eventsure-v3.1
permissions:
  contents: read
concurrency:
  group: eventsure-v33-challenged-finalization
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node --check scripts/finalize_v3_3_challenged.mjs
  finalize:
    needs: preflight
    if: ${{ contains(github.event.head_commit.message, '[AUTO_FINALIZE_CHALLENGED_V33]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Complete inconclusive case after round-two window
        env:
          EVENTSURE_FINALIZE_AUTH: AUTHORIZED_STUDIONET_ONCE
        run: node scripts/finalize_v3_3_challenged.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventsure-v33-challenged-finalization-proof
          path: artifacts/v3_3_challenge_finalization/
          if-no-files-found: warn
