name: EventSure V3.3 Positive Source Feasibility
on:
  push:
    branches:
      - release/eventsure-v3.1
permissions:
  contents: read
jobs:
  inspect-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/qualify_v3_3_positive.mjs
      - run: node scripts/check_v3_3_positive_sources.mjs
